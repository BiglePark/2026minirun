<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네비 UI 수정본</title>

<style>
body {
  font-family: Arial, sans-serif;
  background:#ffffff;
  padding:20px;
}

/* ===== 네비 영역 전체 공통 ===== */
.navibox {
  display: flex;
  align-items: center;
  justify-content: center;

  padding: 8px 10px;
  margin-top: 6px;

  border-radius: 10px;
  font-size: 13px;
  font-weight: 400;
  line-height: 1.3;

  box-sizing: border-box;
}

/* ===== 카카오내비 버튼 ===== */
.kakao-navi-btn {
  background-color: #ffe812;
  color: #000;

  font-weight: 500;
  cursor: pointer;
}

/* ===== 네비포인트 정보 ===== */
.navipoint-box {
  background-color: #f5f5f5;
  color: #333;

  font-size: 12px;
  font-weight: 400;
}
</style>

</head>
<body>

<div class="navibox kakao-navi-btn">
  카카오내비로 길찾기
</div>

<div class="navibox navipoint-box">
  네비포인트 정보
</div>

</body>
</html>
