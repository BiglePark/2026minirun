<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>테스트 네비</title>

  <!-- Kakao JavaScript SDK -->
  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.5/kakao.min.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 60px 20px;
      background: #f5f7fb;
      text-align: center;
      color: #222;
    }

    .card {
      max-width: 420px;
      margin: 0 auto;
      background: #fff;
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: #555;
      margin-bottom: 24px;
    }

    button {
      width: 100%;
      padding: 16px 20px;
      font-size: 18px;
      font-weight: 700;
      background: #2B7CFF;
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
    }

    button:active {
      opacity: 0.85;
    }

    .notice {
      margin-top: 18px;
      font-size: 13px;
      color: #777;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>테스트 네비</h1>
    <p>
      현재 위치에서 출발하여<br>
      경유지 1 → 경유지 2 → 목적지 순서로<br>
      카카오내비를 실행합니다.
    </p>

    <button onclick="startTestNavi()">테스트 네비 시작</button>
  </div>

  <script>
    const KAKAO_JAVASCRIPT_KEY = "89291c1d793d1993078fe312ce30bed0";

    if (!Kakao.isInitialized()) {
      Kakao.init(KAKAO_JAVASCRIPT_KEY);
    }

    function startTestNavi() {
      Kakao.Navi.start({
        name: "목적지",
        x: 127.112429917071,
        y: 37.5176236317445,
        coordType: "wgs84",
        viaPoints: [
          {
            name: "경유지1",
            x: 127.125111736335,
            y: 37.5385036573159
          },
          {
            name: "경유지2",
            x: 127.102052316075,
            y: 37.514062738295
          }
        ]
      });
    }
  </script>
</body>
</html>
