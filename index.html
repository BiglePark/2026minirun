<style>
:root {
  --black:   #0A0A0A;
  --white:   #F5F3EF;
  --yellow:  #FFD600;
  --red:     #E8281A;
  --gray:    #888;
  --gray-lt: #C8C4BC;
  --gray-dk: #222;
  --border:  rgba(255,255,255,0.08);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--black);
  color: var(--white);
  font-family: 'Noto Sans KR', sans-serif;
  overflow-x: hidden;
  cursor: default;
}

/* ══════════════════════════════
   PAGES
══════════════════════════════ */
.page { display: none; min-height: 100vh; }
.page.active { display: block; }

/* ══════════════════════════════
   ── MAIN PAGE ──
══════════════════════════════ */

/* HERO */
.hero {
  height: 100vh; min-height: 600px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative; overflow: hidden;
  background: var(--black);
}

/* Animated grid lines */
.hero::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(232,40,26,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,40,26,0.04) 1px, transparent 1px);
  background-size: 80px 80px;
  animation: gridMove 20s linear infinite;
}
@keyframes gridMove {
  0%   { transform: translate(0, 0); }
  100% { transform: translate(80px, 80px); }
}

/* Diagonal stripe accent */
.hero-stripe {
  position: absolute; top: 0; right: -20%;
  width: 45%; height: 100%;
  background: repeating-linear-gradient(
    -55deg,
    transparent, transparent 18px,
    rgba(232,40,26,0.025) 18px, rgba(232,40,26,0.025) 20px
  );
  pointer-events: none;
}

.hero-content {
  position: relative; z-index: 2;
  text-align: center; width: 100%;
  padding: 0 24px;
}

/* ─ TYPOGRAPHIC HERO ─ */
.hero-year {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(16px, 2.5vw, 22px);
  font-weight: 300; letter-spacing: 0.5em;
  color: var(--red); margin-bottom: 8px;
  animation: fadeUp 0.8s ease both;
}

/* ── 20주년 배지 ── */
.hero-anniversary {
  display: inline-flex; align-items: center; gap: 10px;
  margin-bottom: 24px;
  animation: fadeUp 0.8s 0.05s ease both;
}
.hero-anniv-badge {
  display: inline-flex; flex-direction: column;
  align-items: center; justify-content: center;
  width: 58px; height: 58px;
  border: 1.5px solid var(--red);
  border-radius: 50%;
  position: relative;
  background: rgba(232,40,26,0.07);
}
.hero-anniv-badge::before {
  content: '';
  position: absolute; inset: 4px;
  border: 1px solid rgba(232,40,26,0.25);
  border-radius: 50%;
}
.hero-anniv-num {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 22px; font-weight: 800;
  color: var(--red); line-height: 1;
  letter-spacing: -0.03em;
}
.hero-anniv-th {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 8px; font-weight: 500;
  color: var(--red); letter-spacing: 0.12em;
  text-transform: uppercase; line-height: 1;
  margin-top: 1px;
}
.hero-anniv-text {
  display: flex; flex-direction: column; gap: 2px;
  text-align: left;
}
.hero-anniv-text span:first-child {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 11px; font-weight: 300;
  color: var(--gray); letter-spacing: 0.2em;
  text-transform: uppercase;
}
.hero-anniv-text span:last-child {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 13px; font-weight: 600;
  color: var(--white); letter-spacing: 0.08em;
}

/* ── MINI RUN 메인 타이틀 ── */
.hero-title-wrap {
  position: relative; display: inline-block;
  animation: fadeUp 0.8s 0.1s ease both;
}

/* "2026" large number */
.hero-2026 {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: clamp(100px, 20vw, 260px);
  line-height: 0.85;
  color: transparent;
  -webkit-text-stroke: 1.5px rgba(255,255,255,0.08);
  position: absolute;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  white-space: nowrap; pointer-events: none;
  letter-spacing: -0.04em;
  font-weight: 900;
  z-index: 0;
}

.hero-main-text {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  align-items: center; gap: 0;
}

.hero-mini {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: clamp(76px, 17vw, 210px);
  line-height: 0.88;
  font-weight: 900;
  letter-spacing: -0.03em;
  background: linear-gradient(160deg, #ffffff 0%, #d0ccc4 55%, #999 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 60px rgba(232,40,26,0.15));
}

.hero-run {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: clamp(76px, 17vw, 210px);
  line-height: 0.88;
  font-weight: 900;
  letter-spacing: -0.03em;
  color: var(--red);
  position: relative;
  filter: drop-shadow(0 0 40px rgba(232,40,26,0.5));
}
.hero-run::after {
  content: 'RUN';
  position: absolute; inset: 0;
  color: var(--red);
  filter: blur(32px) opacity(0.4);
  pointer-events: none;
}

/* ── 20주년 수평 구분선 배지 ── */
.hero-divider-row {
  display: flex; align-items: center; gap: 16px;
  justify-content: center;
  margin: 22px auto;
  animation: fadeUp 0.8s 0.3s ease both;
}
.hero-divider-line {
  width: 48px; height: 1px;
  background: linear-gradient(to right, transparent, rgba(232,40,26,0.6));
}
.hero-divider-line.right {
  background: linear-gradient(to left, transparent, rgba(232,40,26,0.6));
}
.hero-divider-dot {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.25em; color: var(--red);
  text-transform: uppercase;
}

.hero-sub {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: clamp(11px, 1.8vw, 14px);
  font-weight: 300; letter-spacing: 0.28em;
  color: var(--gray-lt); text-transform: uppercase;
  animation: fadeUp 0.8s 0.35s ease both;
}

/* ── 코너 데코 ── */
.hero-corner {
  position: absolute; width: 40px; height: 40px;
  border-color: rgba(232,40,26,0.3); border-style: solid;
}
.hero-corner.tl { top: 28px; left: 28px; border-width: 1.5px 0 0 1.5px; }
.hero-corner.tr { top: 28px; right: 28px; border-width: 1.5px 1.5px 0 0; }
.hero-corner.bl { bottom: 60px; left: 28px; border-width: 0 0 1.5px 1.5px; }
.hero-corner.br { bottom: 60px; right: 28px; border-width: 0 1.5px 1.5px 0; }

.hero-scroll-hint {
  position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; letter-spacing: 0.3em; color: var(--gray);
  animation: fadeUp 0.8s 0.6s ease both;
  z-index: 2;
}
.scroll-line {
  width: 1px; height: 48px;
  background: linear-gradient(to bottom, var(--gray), transparent);
  animation: scrollPulse 2s ease-in-out infinite;
}
@keyframes scrollPulse {
  0%,100% { opacity: 0.4; transform: scaleY(1); }
  50%      { opacity: 1;   transform: scaleY(1.15); }
}

/* DAY CARDS SECTION */
.days-section {
  padding: 100px 0 120px;
  position: relative;
  background: var(--black);
}
.days-section::before {
  content: 'SCHEDULE';
  position: absolute; top: 60px; left: 48px;
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 11px; letter-spacing: 0.5em; font-weight: 800;
  color: rgba(255,255,255,0.08); pointer-events: none;
}

.days-header {
  padding: 0 48px; margin-bottom: 56px;
  display: flex; align-items: baseline; gap: 20px;
}
.days-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; letter-spacing: 0.4em;
  color: var(--red); text-transform: uppercase;
}
.days-title {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: clamp(36px, 5vw, 52px);
  font-weight: 900; letter-spacing: -0.03em; color: var(--white);
  line-height: 1;
}

/* DAY CARDS GRID */
.day-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: var(--black);
  border-top: 1px solid rgba(255,255,255,0.06);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
/* 카드 사이 구분선 — gap이 아닌 border로 처리 (모바일 흰색 갭 방지) */
.day-card + .day-card {
  border-left: 1px solid rgba(255,255,255,0.06);
}

.day-card {
  background: var(--black);
  padding: 52px 36px 44px;
  cursor: pointer; position: relative;
  overflow: hidden;
  transition: background 0.3s;
  display: flex; flex-direction: column; justify-content: space-between;
  min-height: 380px;
}
.day-card::before {
  content: '';
  position: absolute; inset: 0;
  background: var(--red);
  transform: translateY(100%);
  transition: transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  z-index: 0;
}
.day-card:hover::before { transform: translateY(0); }
.day-card:hover .dc-num,
.day-card:hover .dc-title,
.day-card:hover .dc-sub,
.day-card:hover .dc-date,
.day-card:hover .dc-spots,
.day-card:hover .dc-arrow { color: var(--white) !important; }
.day-card:hover .dc-line { background: rgba(255,255,255,0.4); }
.day-card:hover .dc-tag { background: rgba(255,255,255,0.15); color: var(--white); }

.day-card > * { position: relative; z-index: 1; }

.dc-top {}
.dc-num {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 72px; line-height: 1;
  font-weight: 900; letter-spacing: -0.04em;
  color: rgba(255,255,255,0.06);
  transition: color 0.3s;
  margin-bottom: 20px;
}
.dc-day-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; letter-spacing: 0.4em;
  color: var(--red); margin-bottom: 10px;
  transition: color 0.3s;
}
.day-card:hover .dc-day-label { color: rgba(0,0,0,0.5); }

.dc-title {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 34px; line-height: 1.05;
  font-weight: 800; letter-spacing: -0.02em; color: var(--white);
  margin-bottom: 6px; transition: color 0.3s;
}
.dc-sub {
  font-size: 12px; color: var(--gray);
  line-height: 1.6; transition: color 0.3s;
  font-weight: 300;
}
.dc-line {
  width: 32px; height: 1px;
  background: rgba(255,255,255,0.2);
  margin: 24px 0; transition: background 0.3s;
}
.dc-date {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; letter-spacing: 0.08em;
  color: var(--gray-lt); margin-bottom: 12px;
  transition: color 0.3s;
}
.dc-spots {
  font-size: 12px; color: var(--gray);
  margin-bottom: 24px; transition: color 0.3s;
  font-weight: 300;
}
.dc-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 28px; }
.dc-tag {
  padding: 3px 10px; border-radius: 2px;
  background: rgba(255,255,255,0.06);
  font-size: 10px; letter-spacing: 0.05em;
  color: var(--gray-lt); transition: all 0.3s;
}
.dc-arrow {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; letter-spacing: 0.15em;
  color: var(--gray); transition: color 0.3s;
  display: flex; align-items: center; gap: 8px;
}
.dc-arrow::after {
  content: '→';
  font-size: 16px; transition: transform 0.3s;
}
.day-card:hover .dc-arrow::after { transform: translateX(4px); }

/* ══════════════════════════════
   ── DETAIL PAGE ──
══════════════════════════════ */
.detail-page { background: var(--black); }

/* Detail Nav */
.detail-nav {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 48px; height: 64px;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.back-btn {
  display: flex; align-items: center; gap: 10px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; letter-spacing: 0.2em;
  color: var(--gray); cursor: pointer;
  transition: color 0.2s; border: none; background: none;
  text-transform: uppercase;
}
.back-btn:hover { color: var(--red); }
.back-btn::before { content: '←'; font-size: 16px; }
.detail-nav-title {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 16px; font-weight: 800;
  letter-spacing: 0.04em; color: var(--white);
}
.detail-nav-day {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; letter-spacing: 0.3em;
  color: var(--red); text-transform: uppercase;
}

/* Detail Hero */
.detail-hero {
  padding: 80px 48px 60px;
  border-bottom: 1px solid var(--border);
  position: relative; overflow: hidden;
}
.detail-hero::after {
  content: attr(data-day-num);
  position: absolute; right: -20px; top: 50%; transform: translateY(-50%);
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 300px; line-height: 1; font-weight: 900;
  color: transparent;
  -webkit-text-stroke: 1px rgba(255,255,255,0.04);
  pointer-events: none;
}
.dh-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; letter-spacing: 0.45em;
  color: var(--red); margin-bottom: 16px;
}
.dh-title {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: clamp(52px, 8vw, 96px);
  font-weight: 900; line-height: 0.92; letter-spacing: -0.03em;
  color: var(--white); margin-bottom: 24px;
}
.dh-meta {
  display: flex; gap: 32px; flex-wrap: wrap;
}
.dh-meta-item {
  display: flex; flex-direction: column; gap: 3px;
}
.dh-meta-label {
  font-size: 10px; letter-spacing: 0.2em;
  color: var(--gray); text-transform: uppercase;
}
.dh-meta-val {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 16px; letter-spacing: 0.05em; color: var(--white);
}

/* Timeline */
.timeline-section { padding: 72px 48px 100px; }
.timeline-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; letter-spacing: 0.4em;
  color: var(--red); margin-bottom: 48px;
  display: flex; align-items: center; gap: 16px;
}
.timeline-label::after {
  content: ''; flex: 1; height: 1px;
  background: var(--border);
}

.timeline { position: relative; }
.timeline::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 1px;
  background: linear-gradient(to bottom, var(--red), rgba(255,214,0,0.1), transparent);
}

.tl-item {
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 0 48px;
  padding: 36px 0 36px 32px;
  border-bottom: 1px solid var(--border);
  position: relative;
  transition: background 0.2s;
}
.tl-item:hover { background: rgba(255,255,255,0.02); }
.tl-item:last-child { border-bottom: none; }

/* Timeline dot */
.tl-item::before {
  content: '';
  position: absolute; left: -4px; top: 44px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--black);
  border: 2px solid var(--red);
  transition: all 0.2s;
}
.tl-item:hover::before { background: var(--red); box-shadow: 0 0 12px rgba(255,214,0,0.5); }

.tl-time-col {}
.tl-time {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 28px; font-weight: 700; letter-spacing: -0.01em;
  color: var(--white); line-height: 1;
}
.tl-duration {
  font-size: 11px; color: var(--gray);
  margin-top: 4px; letter-spacing: 0.05em;
}
.tl-type {
  display: inline-block; margin-top: 10px;
  padding: 2px 9px; border-radius: 2px;
  font-size: 10px; letter-spacing: 0.08em;
  text-transform: uppercase;
}
.tl-type.drive { background: rgba(232,40,26,0.15); color: var(--red); }
.tl-type.meal  { background: rgba(232,40,26,0.12); color: var(--red); }
.tl-type.stay  { background: rgba(255,255,255,0.06); color: var(--gray-lt); }
.tl-type.spot  { background: rgba(100,180,255,0.12); color: #7ec8ff; }
.tl-type.rest  { background: rgba(120,220,120,0.1); color: #7dcc7d; }

.tl-body {}
.tl-place {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: clamp(22px, 3vw, 30px);
  font-weight: 800; letter-spacing: -0.02em; color: var(--white);
  line-height: 1.1; margin-bottom: 10px;
}
.tl-desc {
  font-size: 13px; color: var(--gray);
  line-height: 1.75; margin-bottom: 14px;
  font-weight: 300; max-width: 520px;
}
.tl-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tl-tag {
  padding: 3px 10px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 2px; font-size: 11px;
  color: rgba(255,255,255,0.35); letter-spacing: 0.04em;
}

/* Day nav at bottom */
.detail-bottom-nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 32px 48px;
  border-top: 1px solid var(--border);
}
.nav-btn {
  display: flex; align-items: center; gap: 12px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--gray); cursor: pointer;
  border: none; background: none;
  padding: 12px 0; transition: color 0.2s;
}
.nav-btn:hover { color: var(--red); }
.nav-btn.prev::before { content: '← '; }
.nav-btn.next::after  { content: ' →'; }
.nav-btn:disabled { opacity: 0.2; pointer-events: none; }

/* ══════════════════════════════
   ANIMATIONS
══════════════════════════════ */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
.reveal {
  opacity: 0; transform: translateY(28px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.reveal.in { opacity: 1; transform: none; }

/* ══════════════════════════════
   RESPONSIVE
══════════════════════════════ */
@media (max-width: 960px) {
  .day-cards { grid-template-columns: 1fr 1fr; }
  /* 2열 그리드: 3·4번째 카드는 위쪽 border, 짝수 번째는 왼쪽 border 유지 */
  .day-card + .day-card { border-left: none; }
  .day-card:nth-child(even) { border-left: 1px solid rgba(255,255,255,0.06); }
  .day-card:nth-child(n+3) { border-top: 1px solid rgba(255,255,255,0.06); }
  .days-header { padding: 0 24px; }
  .detail-nav  { padding: 0 24px; }
  .detail-hero { padding: 56px 24px 44px; }
  .timeline-section { padding: 48px 24px 80px; }
  .detail-bottom-nav { padding: 24px; }
  .tl-item { grid-template-columns: 110px 1fr; gap: 0 24px; padding-left: 24px; }
  .tl-time { font-size: 22px; }
}
@media (max-width: 600px) {
  .day-cards { grid-template-columns: 1fr; }
  .day-card { min-height: 280px; padding: 36px 24px 32px; }
  /* 1열 그리드: 왼쪽 border 제거, 위 border로만 구분 */
  .day-card:nth-child(even) { border-left: none; }
  .day-card + .day-card { border-top: 1px solid rgba(255,255,255,0.06); }
  .tl-item { grid-template-columns: 1fr; gap: 8px 0; }
  .timeline::before { display: none; }
  .tl-item::before { display: none; }
  .tl-item { padding-left: 0; }
  .dh-meta { gap: 20px; }
  .detail-nav-title { display: none; }
}
/* ── 비고 박스 멀티 컬러 ── */
.tl-note-box {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 14px;
}
.tl-tag-note {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 4px;
  font-size: 12px; font-weight: 500; letter-spacing: 0.03em;
  border: 1px solid;
}
/* 🔴 RED — 경고·필수 (주유 필수, 시간엄수) */
.tl-tag-note.red {
  background: rgba(232,40,26,0.13); border-color: rgba(232,40,26,0.4); color: #ff6b5e;
}
.tl-tag-note.red::before {
  content: ''; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  background: #E8281A; box-shadow: 0 0 6px rgba(232,40,26,0.8);
}
/* 🟠 ORANGE — 이동·출발 (조별 운행, 차량 선적) */
.tl-tag-note.orange {
  background: rgba(255,120,30,0.12); border-color: rgba(255,120,30,0.4); color: #ff8f4e;
}
.tl-tag-note.orange::before {
  content: ''; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  background: #ff781e; box-shadow: 0 0 6px rgba(255,120,30,0.7);
}
/* 🟡 YELLOW — 일반 안내 (조별 주차, 조별 조율) */
.tl-tag-note.yellow {
  background: rgba(255,200,0,0.1); border-color: rgba(255,200,0,0.35); color: #f5c842;
}
.tl-tag-note.yellow::before {
  content: ''; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  background: #f5c842; box-shadow: 0 0 6px rgba(255,200,0,0.6);
}
/* 🟢 GREEN — 시설·서비스 (아침식사, 샤워 가능, 흑돼지 & 김치찌개 세트) */
.tl-tag-note.green {
  background: rgba(60,200,100,0.1); border-color: rgba(60,200,100,0.35); color: #5dd38a;
}
.tl-tag-note.green::before {
  content: ''; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  background: #3cc864; box-shadow: 0 0 6px rgba(60,200,100,0.6);
}
/* 🔵 BLUE — 집결·확인 (차량 하선, 탑승 준비) */
.tl-tag-note.blue {
  background: rgba(60,140,255,0.1); border-color: rgba(60,140,255,0.35); color: #6eb0ff;
}
.tl-tag-note.blue::before {
  content: ''; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  background: #3c8cff; box-shadow: 0 0 6px rgba(60,140,255,0.6);
}
/* 🟣 PURPLE — 브리핑·안내 (스탭 소개, 일정 브리핑) */
.tl-tag-note.purple {
  background: rgba(160,80,255,0.1); border-color: rgba(160,80,255,0.35); color: #b87fff;
}
.tl-tag-note.purple::before {
  content: ''; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  background: #a050ff; box-shadow: 0 0 6px rgba(160,80,255,0.6);
}
.tl-navi-block {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 10px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,214,0,0.2);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 14px;
}
.tl-navi-info { display: flex; flex-direction: column; gap: 0; flex: 1 1 260px; min-width: 0; }
.tl-navi-label {
  display: none !important;
}
.tl-navi-dest {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 16px; font-weight: 700;
  line-height: 1.35;
  color: var(--white); letter-spacing: -0.01em;
}
.tl-navi-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tl-navi-btn {
  padding: 6px 16px; border-radius: 6px;
  min-height: 34px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 16px; font-weight: 700;
  line-height: 1.35;
  cursor: pointer; border: none;
  transition: opacity 0.2s, transform 0.15s;
  letter-spacing: -0.01em; white-space: nowrap;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.tl-navi-btn:hover { opacity: 0.85; transform: translateY(-1px); }
.tl-navi-btn:active { transform: scale(0.97); }
.tl-navi-note {
  font-size: 10px; color: var(--gray);
  margin-top: 3px; letter-spacing: 0.02em;
}

/* ──  박스 (네비 블록과 유사한 카드형 UI, 녹색 테마) ── */
.tl-rest-blocks {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.tl-rest-blocks .tl-rest-block { margin-bottom: 0; }
@media (max-width: 640px) {
  .tl-rest-blocks { grid-template-columns: 1fr; }
}
.tl-rest-block {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 10px;
  background: rgba(60,200,100,0.06);
  border: 1px solid rgba(60,200,100,0.25);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 14px;
}
.tl-rest-info { display: flex; flex-direction: column; gap: 3px; }
.tl-rest-label {

}

  border: 1px solid rgba(255,255,255,0.1);

/* 네비포인트 리스트 (경유지·목적지 통합 표시) */

  min-width: 56px;

.dest-popup-point.via .dest-popup-point-tag { color: #FEE500; }

/* ── 통화 연결 토스트 알림 (PC/맥에서 번호 복사 안내용) ── */
.call-toast {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%);
  z-index: 10000;
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px;
  background: #1a1a1a;
  border: 1px solid rgba(34,197,94,0.35);
  border-radius: 12px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  min-width: 280px; max-width: 92vw;
  animation: callToastIn 0.3s ease both;
}
.call-toast.out { animation: callToastOut 0.3s ease both; }
@keyframes callToastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(20px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@keyframes callToastOut {
  from { opacity: 1; transform: translateX(-50%) translateY(0); }
  to   { opacity: 0; transform: translateX(-50%) translateY(20px); }
}
.call-toast-icon { font-size: 24px; flex-shrink: 0; }
.call-toast-body { flex: 1; min-width: 0; }
.call-toast-name {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 13px; font-weight: 700; color: var(--white);
  margin-bottom: 2px;
}
.call-toast-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px; font-weight: 700; color: #4ade80;
  letter-spacing: 0.04em; margin-bottom: 4px;
}

.call-toast-close {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  color: var(--gray); font-size: 11px; cursor: pointer;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}

  padding: 0;

  border-bottom: 1px solid var(--border);
}
.theme-card {
  position: relative; overflow: hidden;

  grid-template-columns: 1fr;
  background: var(--black);

}
.theme-card:hover { background: #111; }

.tc-bg-text {
  position: absolute; right: -40px; top: 50%;

  font-size: clamp(120px, 18vw, 220px);
  font-weight: 900; letter-spacing: -0.04em;

}

  font-family: inherit;
}
.rule-menu:hover {
  border-color: rgba(99,102,241,0.5);
  background: rgba(99,102,241,0.06);
  transform: translateY(-3px);
}
.rule-menu:active { transform: scale(0.98); }
.rule-menu-icon {
  width: 48px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(99,102,241,0.12);
  border: 1px solid rgba(99,102,241,0.35);
  border-radius: 10px;
  margin-bottom: 16px;
}
.rule-menu-icon svg {
  width: 26px; height: 26px;
  color: #818cf8;
}
.rule-menu-eyebrow {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; letter-spacing: 0.3em;
  color: #818cf8; text-transform: uppercase;
  margin-bottom: 6px;
}
.rule-menu-title {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 22px; font-weight: 800; letter-spacing: -0.02em;
  color: var(--white);
  margin-bottom: 8px;
}
.rule-menu-desc {
  font-size: 13px; color: var(--gray-lt);
  line-height: 1.6; font-weight: 300;
  flex: 1;
}
.rule-menu-arrow {
  margin-top: 20px;
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
  color: #818cf8;
  padding-bottom: 3px;
  border-bottom: 1px solid rgba(99,102,241,0.4);
  align-self: flex-start;
}
.rule-menu-arrow-icon {
  font-size: 14px; transition: transform 0.2s;
}
.rule-menu:hover .rule-menu-arrow-icon { transform: translateX(4px); }

/* RULE 팝업 - INFO 팝업과 동일 구조, 인디고 톤 */
.rule-popup-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 9300;
  background: rgba(0,0,0,0.82);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  align-items: center; justify-content: center;
  padding: 24px;
  overflow-y: auto;
}
.rule-popup-overlay.active { display: flex; }
.rule-popup {
  position: relative;
  background: #141414;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 14px;
  width: 100%; max-width: 640px;
  max-height: 90vh;
  overflow: hidden;
  display: flex; flex-direction: column;
  animation: popupIn 0.25s ease both;
}
.rule-popup-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 24px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  flex-shrink: 0;
}
.rule-popup-header-left {
  display: flex; align-items: center; gap: 12px;
}
.rule-popup-tag {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; letter-spacing: 0.3em;
  color: #818cf8; text-transform: uppercase; font-weight: 700;
}
.rule-popup-title {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 16px; font-weight: 700;
  color: var(--white); letter-spacing: -0.01em;
}
.rule-popup-close {
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 50%;
  background: none; color: var(--gray); cursor: pointer;
  font-size: 14px;
  transition: border-color 0.2s, color 0.2s;
}
.rule-popup-close:hover { border-color: var(--white); color: var(--white); }
.rule-popup-body {
  padding: 24px;
  overflow-y: auto;
  flex: 1;
}

/* RULE 항목 리스트 */
.rule-list {
  display: flex; flex-direction: column;
  gap: 22px;
}
.rule-list-item {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 14px; align-items: flex-start;
}
.rule-list-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px; font-weight: 700;
  color: #818cf8;
  line-height: 1.3;
}
.rule-list-text {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 14.5px; font-weight: 400;
  color: var(--gray-lt); line-height: 1.7;
}
.rule-list-text strong { color: var(--white); font-weight: 700; }
.rule-list-text .accent-red { color: var(--red); font-weight: 700; }
.rule-list-text .accent-orange { color: #f97316; font-weight: 700; }
.rule-list-text .accent-green { color: #22c55e; font-weight: 700; }
.rule-list-text .accent-indigo { color: #818cf8; font-weight: 700; }
.rule-list-text em {
  color: var(--gray); font-style: normal;
  font-size: 13px;
}
.rule-sub-line {
  display: block;
  margin-top: 8px;
  padding: 10px 14px;
  background: rgba(34,197,94,0.06);
  border-left: 2px solid #22c55e;
  border-radius: 4px;
  font-size: 13px;
  color: #4ade80;
  line-height: 1.6;
}
.rule-sub-line.warn {
  background: rgba(232,40,26,0.06);
  border-left-color: var(--red);
  color: #ff6b5e;
}
.rule-sub-quote {
  display: block;
  margin-top: 6px;
  font-size: 13px;
  color: var(--gray-lt);
  line-height: 1.7;
}
.rule-sub-quote-mini {
  display: block;
  margin-top: 4px;
  font-size: 12px;
  color: var(--gray);
  font-style: italic;
}

/* 팝업 푸터 - 위반 시 안내 */
.rule-popup-footer-warn {
  margin: 18px 0 -6px;
  padding: 12px 16px;
  background: rgba(232,40,26,0.08);
  border: 1px solid rgba(232,40,26,0.3);
  border-radius: 6px;
  font-size: 13px;
  color: #ff6b5e;
  text-align: center;
  font-weight: 600;
}

/* POINT 통합 섹션 — 8 항목 */
.rule-point-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px 28px;
  margin-top: 8px;
}
.rule-point-row {
  display: grid;
  grid-template-columns: 44px 1fr;
  gap: 14px; align-items: center;
  padding: 14px 4px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.rule-point-row-icon {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.rule-point-row-icon svg {
  width: 32px; height: 32px;
  color: var(--white);
}
.rule-point-row.warn .rule-point-row-icon svg { color: var(--red); }
.rule-point-row-text {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 14px; font-weight: 500;
  color: var(--gray-lt); line-height: 1.5;
}
.rule-point-row-text::before {
  content: '·';
  color: var(--gray);
  margin-right: 6px;
  font-weight: 700;
}
.rule-point-row-text .accent { color: var(--red); font-weight: 700; }

@media (max-width: 768px) {
  .rule-point-grid { grid-template-columns: 1fr; gap: 0; }
  .rule-popup { max-height: 92vh; }
}
@media (max-width: 640px) {
  .rule-detail-section { padding: 40px 24px 80px; }
  .rule-point-row { padding: 12px 0; gap: 12px; grid-template-columns: 36px 1fr; }
  .rule-point-row-icon { width: 32px; height: 32px; }
  .rule-point-row-icon svg { width: 26px; height: 26px; }
  .rule-point-row-text { font-size: 13px; }
}


/* ══════════════════════════════
   POINT DETAIL PAGE (주의사항 상세)
══════════════════════════════ */
.point-detail-section {
  padding: 56px 48px 100px;
  max-width: 1100px; margin: 0 auto;
}

/* "POINT" 거대 타이틀 (이미지 톤 모방) */
.point-mega-title {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: clamp(72px, 14vw, 160px);

  letter-spacing: -0.04em;
  text-align: center;

}
.point-mega-title .accent {

}

.point-intro {
  margin-bottom: 48px;

}
.point-intro-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; letter-spacing: 0.35em;
  color: #a855f7; text-transform: uppercase;

}
.point-intro-desc {
  font-size: 14px; color: var(--gray-lt);

}

/* 8개 그리드 (2칼럼) */
.point-grid {

}
.point-row {

}

.point-row-icon {

}
.point-row-icon svg {
  width: 44px; height: 44px;
  color: var(--white);
}
.point-row.warn .point-row-icon svg {
  color: var(--red);
}
.point-row-text {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 15px; font-weight: 500;
  color: var(--gray-lt); line-height: 1.5;
  letter-spacing: -0.01em;
}
.point-row-text::before {
  content: '·';
  color: var(--gray);
  margin-right: 8px;
  font-weight: 700;
}
.point-row-text .accent {
  color: var(--red); font-weight: 700;
}

/* 푸터 메시지 */
.point-footer-msg {

  text-align: center;
  background: rgba(168,85,247,0.05);

}
.point-footer-msg .accent {

}

@media (max-width: 768px) {
  .point-grid { grid-template-columns: 1fr; gap: 0; }
}
@media (max-width: 640px) {
  .point-detail-section { padding: 40px 24px 80px; }
  .point-row { padding: 16px 0; gap: 14px; grid-template-columns: 50px 1fr; }
  .point-row-icon { width: 48px; height: 48px; }
  .point-row-icon svg { width: 36px; height: 36px; }
  .point-row-text { font-size: 13.5px; }
}

/* ══════════════════════════════
   GROUP DETAIL PAGE (조 명단 상세)
══════════════════════════════ */
.group-detail-section {
  padding: 56px 48px 100px;
  max-width: 1200px; margin: 0 auto;
}
.group-detail-intro {
  margin-bottom: 48px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.group-detail-intro-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; letter-spacing: 0.35em;
  color: #2dd4bf; text-transform: uppercase;
  margin-bottom: 10px;
}
.group-detail-intro-desc {
  font-size: 14px; color: var(--gray-lt);
  line-height: 1.7; font-weight: 300;
  max-width: 640px;
}

.groups-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.group-tile {
  position: relative;
  padding: 28px 24px 24px;
  background: rgba(255,255,255,0.025);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  transition: border-color 0.3s, background 0.3s, transform 0.2s;
}
.group-tile:hover {
  transform: translateY(-2px);
  background: rgba(255,255,255,0.04);
}
.group-tile::before {
  content: '';
  position: absolute; left: 0; top: 16px; bottom: 16px;
  width: 3px; border-radius: 0 3px 3px 0;
  background: var(--group-color, #888);
}
.group-tile-header {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px dashed rgba(255,255,255,0.08);
}
.group-tile-name {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 22px; font-weight: 800;
  color: var(--group-color, var(--white));
  letter-spacing: -0.02em;
  text-transform: uppercase;
}
.group-tile-count {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; letter-spacing: 0.2em;
  color: var(--gray); text-transform: uppercase;
}
.group-tile-members {
  display: flex; flex-direction: column; gap: 10px;
}
.group-member {
  display: flex; align-items: center; gap: 10px;
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 15px; font-weight: 500;
  color: var(--gray-lt);
  transition: color 0.2s;
}
.group-tile:hover .group-member { color: var(--white); }
.group-member::before {
  content: '';
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--group-color, rgba(255,255,255,0.3));
  flex-shrink: 0;
}
.group-member.leader {
  font-weight: 700; color: var(--white);
}

/* 조장 배지 + 통화 버튼 — 실제 클릭 가능한 a 태그 */
.group-leader-tag {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px; letter-spacing: 0.15em;
  padding: 2px 6px; border-radius: 3px;
  background: var(--group-color, rgba(255,255,255,0.1));
  color: #111; font-weight: 700;
  text-transform: uppercase;
  flex-shrink: 0;
}
.group-call-btn {
  display: inline-flex; align-items: center; gap: 5px;
  margin-left: auto;
  padding: 5px 10px;
  background: rgba(34,197,94,0.10);
  border: 1px solid rgba(34,197,94,0.4);
  border-radius: 14px;
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
  color: #4ade80;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, transform 0.15s;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.group-call-btn:hover {
  background: rgba(34,197,94,0.18);
  border-color: rgba(34,197,94,0.7);
  transform: translateY(-1px);
}
.group-call-btn:active { transform: scale(0.95); }
.group-call-btn-icon {
  width: 13px; height: 13px;
  flex-shrink: 0;
  display: inline-block;
}
.group-call-btn-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; letter-spacing: 0.04em;
  display: none; /* 모바일 기본 숨김, 데스크톱에서만 표시 */
}
@media (min-width: 768px) {
  .group-call-btn-num { display: inline; }
}

/* 조별 컬러 변수 */
.group-tile.group-red    { --group-color: #E8281A; }
.group-tile.group-blue   { --group-color: #4da6ff; }
.group-tile.group-yellow { --group-color: #FEE500; }
.group-tile.group-green  { --group-color: #22c55e; }
.group-tile.group-purple { --group-color: #a855f7; }
.group-tile.group-orange { --group-color: #f97316; }
.group-tile.group-pink   { --group-color: #ec4899; }
.group-tile.group-cyan   { --group-color: #06b6d4; }

/* ── STAFF 섹션 ── */
.staff-section {
  margin-top: 60px;
  padding-top: 48px;
  border-top: 1px solid var(--border);
}
.staff-section-header {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 24px;
  flex-wrap: wrap; gap: 8px;
}
.staff-section-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; letter-spacing: 0.35em;
  color: #2dd4bf; text-transform: uppercase;
}
.staff-section-title {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 26px; font-weight: 800; letter-spacing: -0.02em;
  color: var(--white);
}
.staff-section-desc {
  font-size: 13px; color: var(--gray-lt); line-height: 1.6;
  margin-bottom: 24px; font-weight: 300;
}
.staff-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
}
.staff-tile {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  background: rgba(255,255,255,0.025);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  transition: border-color 0.3s, background 0.3s;
}
.staff-tile:hover {
  border-color: rgba(45,212,191,0.4);
  background: rgba(45,212,191,0.05);
}
.staff-tile-name {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 15px; font-weight: 600;
  color: var(--white); letter-spacing: -0.01em;

@media (max-width: 640px) {
  .group-detail-section { padding: 40px 24px 80px; }
  .groups-grid { grid-template-columns: 1fr; }
  .staff-grid { grid-template-columns: 1fr; }
}

/* ══════════════════════════════
   THEME DETAIL PAGE
══════════════════════════════ */
.theme-detail-page {}

.td-section-text {

}
.staffroll-hero-meta-val {
  font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
  font-size: 14px; font-weight: 600;
  color: var(--white); letter-spacing: 0.02em;
}

}
